name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle & sync Capacitor
        run: npm run cap:sync

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret present, decoding to $RUNNER_TEMP/release.jks"
            python3 -c "import base64, os; data = os.environ['KEYSTORE_BASE64']; open('$RUNNER_TEMP/release.jks', 'wb').write(base64.b64decode(data))"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; building unsigned/debug-signed APK"
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            echo "Building signed release APK..."
            ./gradlew assembleRelease
          else
            echo "Building release and debug APKs..."
            ./gradlew assembleDebug assembleRelease
          fi

      - name: Locate output APK
        id: find_apk
        run: |
          # Prefer signed release APK if generated, fall back to unsigned release or debug
          APK_PATH=""
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" sunday-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunday-android-apk
          path: sunday-app.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate Release Tag & Name
        id: release_info
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=Sunday $TAG_NAME ($SHORT_SHA)" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          files: sunday-app.apk
          generate_release_notes: true
          draft: false
          prerelease: false
